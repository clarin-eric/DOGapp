{% extends 'UI/_content.html' %}
{% load dogui_extras %}
{% block result %}
        <div id='dog_sniff_result_table'>
            <table>
                <thead>
                    <tr>
                        <th>PID</th>
                        <th>Recognised host</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    {% for pid, sniff_res in sniff_response.items %}
                        <tr>
                            <td>
                                {% if sniff_res %}
                                    <input type="checkbox" class="centered-checkbox" name="pid_field" value="{{ pid }}">
                                {% endif %}
                                {{ pid }}
                            </td>
                            <td>
                                {% if sniff_res %}
                                    <a href={{ sniff_res.host_netloc }}>{{ sniff_res.name }}</a></td>
                                {% else %}
                                    NA</td>
                                {% endif %}
                            <td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
            <button type="submit" name="functionality_field" value="fetch">Fetch selected</button>
        </div>
{% endblock result%}
