{% extends 'UI/_content.html' %}
{% load dogui_extras %}
{% block result %}
    <form method="GET" action="/">
        <div id='dog_sniff_result_table'>
            <table>
                <thead>
                    <tr>
                        <th>PID</th>
                        <th>Recognised host</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    {% for pid, sniff_res in sniff_response.items %}
                        <tr>
                            <td class="flex-container">
                                {% if sniff_res %}
                                    <div class="flex-cell">
                                        <input type="checkbox" class="centered-checkbox" name="pid_field" value="{{ pid }}">
                                    </div>
                                {% endif %}
                                <span class="left-text"> {{ pid }}</span>
                            </td>
                            <td>
                                {% if sniff_res %}
                                    <a href={{ sniff_res.host_netloc }}>{{ sniff_res.name }}</a>
                                {% else %}
                                    NA<
                                {% endif %}
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <button type="submit" name="functionality_field" value="fetch">Fetch selected</button>
    </form>
{% endblock result%}
